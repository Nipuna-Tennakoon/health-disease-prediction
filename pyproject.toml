[project]
name = "health-disease-prediction"
version = "0.1.0"
description = "Reproducible pipeline that predicts Has_Disease from raw patient health records"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dill>=0.4.1",
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "ruamel-yaml>=0.19.1",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "wandb>=0.30.0",
    "xgboost>=3.2.0",
]

[project.scripts]
hdp = "health_disease_prediction.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health_disease_prediction"]

[dependency-groups]
app = [
    "streamlit>=1.65.0",
]
dev = [
    "pytest>=9.1.1",
]
